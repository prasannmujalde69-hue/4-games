<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2048 | Game Hub</title>

    <link
        rel="stylesheet"
        href="../css/2048.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            🎮 Game Hub
        </a>

        <a href="../index.html" class="back-btn">
            ← Back to Games
        </a>

    </header>


    <!-- GAME -->

    <main class="game-page">

        <section class="game-header">

            <div>

                <p class="game-label">
                    GAME HUB
                </p>

                <h1>2048</h1>

                <p class="description">
                    Combine the numbers and reach
                    the 2048 tile!
                </p>

            </div>


            <div class="score-container">

                <div class="score-box">

                    <span>SCORE</span>

                    <strong id="score">
                        0
                    </strong>

                </div>

                <div class="score-box">

                    <span>BEST</span>

                    <strong id="best">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- CONTROLS -->

        <div class="controls">

            <button id="newGame">
                New Game
            </button>

        </div>


        <!-- BOARD -->

        <div
            class="board"
            id="board"
        >

            <div class="game-over" id="gameOver">

                <h2>
                    Game Over!
                </h2>

                <button onclick="startGame()">
                    Try Again
                </button>

            </div>

        </div>


        <!-- INSTRUCTIONS -->

        <section class="instructions">

            <h2>
                How to Play
            </h2>

            <p>
                Use the
                <strong>arrow keys</strong>
                on your keyboard to move the tiles.
            </p>

            <p>
                On mobile, swipe
                <strong>up, down, left or right</strong>.
            </p>

            <p>
                When two tiles with the same number
                touch, they merge into one!
            </p>

            <div class="mobile-controls">

                <button data-direction="up">
                    ↑
                </button>

                <div>

                    <button data-direction="left">
                        ←
                    </button>

                    <button data-direction="down">
                        ↓
                    </button>

                    <button data-direction="right">
                        →
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/2048.js"></script>

</body>

</html>
