<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Snake | Game Hub</title>

    <link
        rel="stylesheet"
        href="../css/snake.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            🎮 Game Hub
        </a>

        <a href="../index.html" class="back-btn">
            ← Back to Games
        </a>

    </header>


    <!-- GAME -->

    <main class="game-page">

        <section class="game-header">

            <div>

                <p class="game-label">
                    GAME HUB
                </p>

                <h1>Snake 🐍</h1>

                <p class="description">
                    Eat the food, grow longer,
                    and don't hit yourself!
                </p>

            </div>


            <div class="score-container">

                <div class="score-box">

                    <span>SCORE</span>

                    <strong id="score">
                        0
                    </strong>

                </div>

                <div class="score-box">

                    <span>BEST</span>

                    <strong id="best">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- CONTROLS -->

        <div class="controls">

            <button id="newGame">
                New Game
            </button>

        </div>


        <!-- GAME BOARD -->

        <div class="snake-container">

            <canvas
                id="snakeCanvas"
                width="500"
                height="500"
            ></canvas>


            <div
                class="game-over"
                id="gameOver"
            >

                <h2>
                    Game Over!
                </h2>

                <p>
                    Final Score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

                <button id="restartButton">
                    Play Again
                </button>

            </div>

        </div>


        <!-- CONTROLS -->

        <section class="instructions">

            <h2>
                How to Play
            </h2>

            <p>
                Use the
                <strong>arrow keys</strong>
                to control the snake.
            </p>

            <p>
                On mobile, use the buttons below.
            </p>


            <div class="mobile-controls">

                <button data-direction="up">
                    ↑
                </button>

                <div>

                    <button data-direction="left">
                        ←
                    </button>

                    <button data-direction="down">
                        ↓
                    </button>

                    <button data-direction="right">
                        →
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/snake.js"></script>

</body>

</html>
